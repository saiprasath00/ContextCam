name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK with version tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/ContextCam-${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ContextCam-apk
          path: app/build/outputs/apk/release/ContextCam-*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ContextCam ${{ github.ref_name }}"
          body: |
            ## ContextCam ${{ github.ref_name }}

            ### What's new
            - Context-aware photo capture with location tagging
            - Add notes at capture time
            - Full-text search across notes and locations
            - Clean Material 3 gallery

            ### Install
            1. Download `ContextCam-${{ github.ref_name }}.apk`
            2. Enable **Install from unknown sources** on your device
            3. Open the APK to install

            > Note: APK is unsigned. For a signed build, set up `KEYSTORE_FILE`, `KEY_ALIAS`, `KEY_PASSWORD`, `STORE_PASSWORD` secrets.
          files: app/build/outputs/apk/release/ContextCam-*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
